<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강찬의 메가 시티 타이쿤 (Chan's Mega City Tycoon)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }

        body {
            background-color: #1a1c23;
            color: #f5f6fa;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .game-container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        .main-panel {
            background: #222531;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d3245;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            color: #4cd137;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
        }

        .stat-item {
            background: #2d3245;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-item span {
            color: #00a8ff;
        }

        /* 🎟️ 프로모션 코드 입력창 스타일 */
        .promo-container {
            background: #2d3245;
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border: 1px dashed #4cd137;
        }

        .promo-title {
            font-size: 14px;
            font-weight: bold;
            color: #4cd137;
            white-space: nowrap;
        }

        .promo-input-group {
            display: flex;
            gap: 8px;
            flex-grow: 1;
            max-width: 300px;
        }

        .promo-input {
            background: #1e212b;
            border: 1px solid #3d445f;
            border-radius: 6px;
            padding: 6px 12px;
            color: #fff;
            font-size: 13px;
            width: 100%;
            outline: none;
        }

        .promo-input:focus {
            border-color: #00a8ff;
        }

        .promo-btn {
            background: #00a8ff;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .promo-btn:hover {
            background: #0097e6;
        }

        .city-grid {
            background: #1e212b;
            border: 3px solid #2d3245;
            border-radius: 8px;
            height: 320px;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 4px;
            padding: 8px;
        }

        .city-tile {
            background: #272a37;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .city-tile.built:hover {
            background: #c23616 !important;
            transform: scale(1.05);
        }
        
        .city-tile.built:hover::after {
            content: "💥철거(50% 환불)";
            position: absolute;
            font-size: 9px;
            bottom: 2px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 1px 3px;
            border-radius: 3px;
            white-space: nowrap;
        }

        .city-tile:not(.built):hover {
            transform: scale(1.05);
            background: #2d3245;
        }

        .click-area {
            text-align: center;
            padding: 15px;
        }

        .click-btn {
            background: linear-gradient(135deg, #4cd137, #44bd32);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(68, 189, 50, 0.4);
        }

        .click-btn:active {
            transform: scale(0.98);
        }

        .shop-panel {
            background: #222531;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .shop-panel h2 {
            font-size: 18px;
            border-bottom: 2px solid #2d3245;
            padding-bottom: 8px;
            color: #00a8ff;
        }

        .category-desc {
            font-size: 12px;
            color: #8c91a5;
            margin-top: -10px;
            margin-bottom: 5px;
        }

        .build-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .build-list::-webkit-scrollbar {
            width: 6px;
        }
        .build-list::-webkit-scrollbar-thumb {
            background: #2d3245;
            border-radius: 3px;
        }

        .build-card {
            background: #2d3245;
            border: 1px solid transparent;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .build-card:hover {
            border-color: #00a8ff;
        }

        .build-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .build-title {
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .build-effect {
            font-size: 11px;
            color: #a4b0be;
        }

        .build-count {
            font-size: 11px;
            color: #00a8ff;
            font-weight: bold;
        }

        .buy-btn {
            background: #00a8ff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            min-width: 90px;
            text-align: center;
        }

        .buy-btn:hover {
            background: #0097e6;
        }

        .buy-btn:disabled {
            background: #718093;
            color: #a4b0be;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="main-panel">
        <header>
            <h1>🏙️ 메가 시티 타이쿤</h1>
            <div class="stats-bar">
                <div class="stat-item">💰 자금: <span id="stat-money">0</span> G</div>
                <div class="stat-item">👥 인구: <span id="stat-pop" style="color:#4cd137;">0</span> 명</div>
                <div class="stat-item">📈 수익: <span id="stat-gps" style="color:#eccc68;">0</span> G/s</div>
            </div>
        </header>

        <!-- 🎟️ 프로모션 코드 입력 UI 구역 -->
        <div class="promo-container">
            <span class="promo-title">🎟️ 프로모션 코드</span>
            <div class="promo-input-group">
                <input type="text" id="promo-code-input" class="promo-input" placeholder="코드를 입력하세요">
                <button class="promo-btn" id="promo-code-btn">사용하기</button>
            </div>
        </div>

        <div class="city-grid" id="city-board"></div>

        <div class="click-area">
            <button class="click-btn" id="manual-click">🏢 기본 세금 수집 (+10 G)</button>
        </div>
    </div>

    <div class="shop-panel">
        <h2>🏠 주거 시설 (인구 증가)</h2>
        <p class="category-desc">주민들이 입주할 수 있는 보금자리를 마련합니다.</p>
        <div class="build-list" id="list-residential"></div>

        <h2>🏪 편의 시설 (균형 성장)</h2>
        <p class="category-desc">상권을 형성하고 소규모 고정 자금을 확보합니다.</p>
        <div class="build-list" id="list-amenity"></div>

        <h2>🏢 메가 빌딩 (대량 수익)</h2>
        <p class="category-desc">막대한 자금을 투자하여 대형 수익을 창출합니다.</p>
        <div class="build-list" id="list-commercial"></div>
    </div>
</div>
<script>
    // 시스템 데이터 상태 관리
    const state = {
        money: 100, 
        population: 0,
        gps: 0,
        builtBuildings: new Array(50).fill(null),
        isPromoUsed: false // 프로모션 코드 중복 사용 방지 플래그
    };

    // 건축물 기본 정보 테이블
    const buildingData = {
        residential: [
            { id: 'wood_house', name: '오두막집', icon: '🪵', cost: 40, baseCost: 40, pop: 3, gps: 0, count: 0 },
            { id: 'iron_house', name: '철조 주택', icon: '🏡', cost: 200, baseCost: 200, pop: 12, gps: 0, count: 0 },
            { id: 'concrete_apt', name: '콘크리트 빌라', icon: '🏢', cost: 1200, baseCost: 1200, pop: 55, gps: 0, count: 0 }
        ],
        amenity: [
            { id: 'conv_store', name: '24시 편의점', icon: '🏪', cost: 150, baseCost: 150, pop: 1, gps: 4, count: 0 },
            { id: 'sauna', name: '전통 불한증막', icon: '♨️', cost: 800, baseCost: 800, pop: 3, gps: 18, count: 0 },
            { id: 'hotel', name: '그랜드 호텔', icon: '🏨', cost: 4500, baseCost: 4500, pop: 10, gps: 85, count: 0 }
        ],
        commercial: [
            { id: 'office', name: 'IT 테크 기업', icon: '🖥️', cost: 15000, baseCost: 15000, pop: 20, gps: 340, count: 0 },
            { id: 'observatory', name: '타워 전망대', icon: '🗼', cost: 85000, baseCost: 85000, pop: 50, gps: 1800, count: 0 }
        ]
    };

    const totalTiles = 50;
    const moneyDisplay = document.getElementById('stat-money');
    const popDisplay = document.getElementById('stat-pop');
    const gpsDisplay = document.getElementById('stat-gps');
    const cityBoard = document.getElementById('city-board');

    // 맵 보드 초기화 및 클릭 이벤트 바인딩
    function initMap() {
        cityBoard.innerHTML = '';
        for (let i = 0; i < totalTiles; i++) {
            const tile = document.createElement('div');
            tile.className = 'city-tile';
            tile.id = `tile-${i}`;
            tile.textContent = '🌱';
            
            // 타일 클릭 시 철거 프로세스 실행
            tile.addEventListener('click', () => {
                demolishBuilding(i);
            });
            
            cityBoard.appendChild(tile);
        }
    }

    // UI 데이터 출력 동기화 함수
    function render() {
        moneyDisplay.textContent = Math.floor(state.money).toLocaleString();
        popDisplay.textContent = state.population.toLocaleString();
        gpsDisplay.textContent = state.gps.toLocaleString();

        // 상점 패널 상태 업데이트
        Object.keys(buildingData).forEach(cat => {
            buildingData[cat].forEach(b => {
                const btn = document.getElementById(`btn-${b.id}`);
                const countLbl = document.getElementById(`count-${b.id}`);
                if (btn) {
                    btn.disabled = state.money < b.cost;
                    btn.textContent = `${Math.floor(b.cost).toLocaleString()} G`;
                }
                if (countLbl) {
                    countLbl.textContent = `보유: ${b.count}개`;
                }
            });
        });

        // 타일 데이터 그래픽 매핑
        for (let i = 0; i < totalTiles; i++) {
            const tile = document.getElementById(`tile-${i}`);
            if (state.builtBuildings[i]) {
                tile.textContent = state.builtBuildings[i].icon;
                tile.classList.add('built');
            } else {
                tile.textContent = '🌱';
                tile.classList.remove('built');
            }
        }
    }

    // 상점 인터페이스 목록 그리기
    function buildShopUI() {
        Object.keys(buildingData).forEach(category => {
            const container = document.getElementById(`list-${category}`);
            container.innerHTML = '';
            
            buildingData[category].forEach(b => {
                const card = document.createElement('div');
                card.className = 'build-card';
                card.innerHTML = `
                    <div class="build-info">
                        <div class="build-title">
                            <span>${b.icon} ${b.name}</span>
                            <span class="build-count" id="count-${b.id}">보유: 0개</span>
                        </div>
                        <div class="build-effect">👥 +${b.pop}명 | 📈 +${b.gps}G/s</div>
                    </div>
                    <button class="buy-btn" id="btn-${b.id}" onclick="buyBuilding('${category}', '${b.id}')">
                        ${b.cost} G
                    </button>
                `;
                container.appendChild(card);
            });
        });
    }

    // 기본 수동 클릭 징수
    document.getElementById('manual-click').addEventListener('click', () => {
        state.money += 10;
        render();
    });

    // 🎟️ 프로모션 코드 검증 및 처리 로직 추가
    document.getElementById('promo-code-btn').addEventListener('click', () => {
        const inputField = document.getElementById('promo-code-input');
        const code = inputField.value.trim();

        if (state.isPromoUsed) {
            alert('이미 프로모션 코드를 사용하셨습니다!');
            return;
        }

        if (code === 'city') {
            state.money += 20000;
            state.isPromoUsed = true;
            inputField.disabled = true;
            document.getElementById('promo-code-btn').disabled = true;
            document.getElementById('promo-code-btn').innerText = '사용 완료';
            alert('🎉 프로모션 코드 인증 성공! 20,000 G가 지급되었습니다.');
            render();
        } else {
            alert('❌ 잘못된 프로모션 코드입니다. 다시 확인해 주세요.');
        }
    });

    // 건물 구매 및 맵 배치
    window.buyBuilding = function(category, id) {
        const target = buildingData[category].find(b => b.id === id);
        if (!target || state.money < target.cost) return;

        let targetIndex = -1;
        for (let i = 0; i < totalTiles; i++) {
            if (!state.builtBuildings[i]) {
                targetIndex = i;
                break;
            }
        }

        if (targetIndex === -1) {
            alert('도시의 부지가 부족합니다! 건물을 철거하거나 공간을 확보해 주세요.');
            return;
        }

        // 상태값 차감 및 가산
        state.money -= target.cost;
        
        // 현재 건설 시점의 가격을 건물 인스턴스에 기록 (철거 환불 연산용)
        state.builtBuildings[targetIndex] = {
            id: target.id,
            category: category,
            icon: target.icon,
            purchaseCost: target.cost, 
            pop: target.pop,
            gps: target.gps
        };

        target.count += 1;
        state.population += target.pop;
        state.gps += target.gps;
        
        // 인플레이션 가격 상승 적용 (1.2배)
        target.cost = Math.ceil(target.cost * 1.2);

        render();
    };

    // 건물 철거 및 자금 회수 (50% 환불)
    function demolishBuilding(index) {
        const building = state.builtBuildings[index];
        if (!building) return; 

        if (confirm(`이 시설을 철거하시겠습니까?\n[철거 보상: ${Math.floor(building.purchaseCost * 0.5).toLocaleString()} G 반환]`)) {
            const refund = Math.floor(building.purchaseCost * 0.5);
            state.money += refund;

            state.population -= building.pop;
            state.gps -= building.gps;

            const target = buildingData[building.category].find(b => b.id === building.id);
            if (target) {
                target.count -= 1;
                target.cost = Math.max(target.baseCost, Math.ceil(target.cost / 1.2));
            }

            state.builtBuildings[index] = null;
            render();
        }
    }

    // 초당 자원 자동 갱신 타이머 루프
    setInterval(() => {
        state.money += state.gps / 10;
        render();
    }, 100);

    // 구동 개시
    initMap()
    buildShopUI();
    render();
</script>
</body>
</html>
